<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNova Mobile Fingerprint Authenticator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0B1120;
            color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .mobile-card {
            background: #111827;
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .mobile-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            color: #38BDF8;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .mobile-icon {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #38BDF8;
            margin: 0 auto 16px auto;
            border: 1px solid rgba(56, 189, 248, 0.3);
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
            70% { box-shadow: 0 0 0 16px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
        .detail-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px;
            margin: 16px 0;
            text-align: left;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: #94A3B8; }
        .detail-val { color: #F1F5F9; font-weight: 500; font-family: monospace; }
        .approve-btn {
            background: #0284C7;
            color: #FFFFFF;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .approve-btn:hover { background: #0369A1; }
        .approve-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-pill {
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            margin-top: 14px;
            display: none;
            line-height: 1.4;
        }
        .status-pill.success {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }
        .status-pill.error {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }
        .status-pill.info {
            background: rgba(56, 189, 248, 0.12);
            color: #38BDF8;
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: block;
        }
        .app-link-box {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            color: #64748B;
        }
        .app-link-box a {
            color: #38BDF8;
            text-decoration: none;
        }
        .app-link-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="mobile-card">
        <div class="mobile-badge">
            <i class="fa-solid fa-fingerprint"></i> Android Native BiometricPrompt
        </div>

        <div class="mobile-icon" id="mobileIcon">
            <i class="fa-solid fa-fingerprint"></i>
        </div>

        <h2 style="font-size: 18px; margin: 0 0 6px 0; color: #F8FAFC;">Fingerprint Authentication</h2>
        <p style="font-size: 13px; color: #94A3B8; margin: 0 0 16px 0;">Touch your mobile fingerprint sensor to authorize your computer login.</p>

        <div class="detail-box">
            <div class="detail-row">
                <span class="detail-label">Account:</span>
                <span class="detail-val" id="dispEmail">student@nkocet.edu</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Session ID:</span>
                <span class="detail-val" id="dispSession">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Biometric Hardware:</span>
                <span class="detail-val" id="dispBioStatus" style="color: #10B981;"><i class="fa-solid fa-check"></i> Sensor Detected</span>
            </div>
        </div>

        <button type="button" class="approve-btn" id="btnBiometricVerify">
            <i class="fa-solid fa-fingerprint fa-lg"></i> Verify Fingerprint
        </button>

        <div id="statusPill" class="status-pill"></div>

        <div class="app-link-box">
            <span>Using CyberNova Android Companion App? </span>
            <a href="#" id="linkOpenNativeApp">Open in Native App &rarr;</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get("session") || "";
        const email = (params.get("email") || "student@nkocet.edu").toLowerCase();

        document.getElementById("dispEmail").textContent = email;
        document.getElementById("dispSession").textContent = sessionId ? sessionId.substring(0, 16) + "..." : "Active Session";

        const btnVerify = document.getElementById("btnBiometricVerify");
        const statusPill = document.getElementById("statusPill");
        const mobileIcon = document.getElementById("mobileIcon");
        const dispBioStatus = document.getElementById("dispBioStatus");
        const linkOpenNativeApp = document.getElementById("linkOpenNativeApp");

        // Deep link to Android companion application if installed
        linkOpenNativeApp.href = `cybernova://auth?session=${encodeURIComponent(sessionId)}&email=${encodeURIComponent(email)}`;

        // Check platform biometric support on Android
        async function checkBiometrics() {
            if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
                try {
                    const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                    if (!available) {
                        dispBioStatus.innerHTML = '<span style="color:#F59E0B;"><i class="fa-solid fa-triangle-exclamation"></i> Screen Lock Active</span>';
                    }
                } catch (_) {}
            }
        }
        checkBiometrics();

        btnVerify.addEventListener("click", async () => {
            btnVerify.disabled = true;
            btnVerify.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Awaiting Fingerprint Sensor...';
            statusPill.className = "status-pill info";
            statusPill.innerHTML = '<i class="fa-solid fa-fingerprint fa-bounce"></i> <strong>Touch the fingerprint sensor</strong> on your phone to verify your identity.';

            try {
                let signature = null;
                let biometricSuccess = false;

                // 1. Trigger Android OS Native BiometricPrompt via WebAuthn Platform Authenticator
                if (window.PublicKeyCredential) {
                    try {
                        const challengeBytes = new TextEncoder().encode(sessionId || "CYBERNOVA_CHALLENGE");

                        // Request platform biometric authentication (Android BiometricPrompt)
                        const assertion = await navigator.credentials.get({
                            publicKey: {
                                challenge: challengeBytes,
                                rpId: window.location.hostname,
                                userVerification: "required", // FORCES ANDROID OS BIOMETRIC PROMPT
                                timeout: 60000
                            }
                        });

                        if (assertion && assertion.response) {
                            biometricSuccess = true;
                            // Encode clientDataJSON and signature
                            const sigBuf = assertion.response.signature || assertion.response.authenticatorData;
                            if (sigBuf) {
                                const b64 = btoa(String.fromCharCode(...new Uint8Array(sigBuf)));
                                signature = b64;
                            }
                        }
                    } catch (webAuthnErr) {
                        console.warn("Native WebAuthn Biometric prompt result:", webAuthnErr);

                        // If user canceled the BiometricPrompt or sensor failed
                        if (webAuthnErr.name === "NotAllowedError") {
                            throw new Error("Biometric verification cancelled or fingerprint not recognized.");
                        }

                        // Fallback: If no credential yet registered on this domain, use registration-based BiometricPrompt
                        try {
                            const cred = await navigator.credentials.create({
                                publicKey: {
                                    challenge: new TextEncoder().encode(sessionId),
                                    rp: { name: "CyberNova Security", id: window.location.hostname },
                                    user: {
                                        id: new TextEncoder().encode(email),
                                        name: email,
                                        displayName: email.split("@")[0]
                                    },
                                    pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
                                    authenticatorSelection: {
                                        authenticatorAttachment: "platform", // ANDROID FINGERPRINT
                                        userVerification: "required"
                                    },
                                    timeout: 60000
                                }
                            });
                            if (cred) biometricSuccess = true;
                        } catch (createErr) {
                            if (createErr.name === "NotAllowedError") {
                                throw new Error("Fingerprint verification cancelled by user.");
                            }
                        }
                    }
                }

                // 2. Cryptographic Challenge-Response Signature
                const isStaff = email.includes("staff");
                const defaultPkcs8 = isStaff
                    ? "MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgxk5oPgBvQjJGLFA4jfxdddE/8xM6/xVcMyd/GE+XYHehRANCAARPUIWbl9HF8pS068+0tqbBMgIPLOncQUKc66iTJptCmBMQlV2mdhuPI3Gmr3Acxqhik7VfAdKXDv3+v2/ss/ph"
                    : "MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgj3OZ1lDndLmqlA8r2VWwWnlotLVuG1hkSPpiC1RDSaGhRANCAARAK2yKY0YlX0PFRJZ47OugdA1uMM5h2NG4ymOj2K1BPBZfHVI1TK0Bv9tuy3l0keWQj3BKpsmsYPHF4pTLnx56";

                try {
                    const binaryStr = atob(defaultPkcs8);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                    const key = await window.crypto.subtle.importKey(
                        "pkcs8",
                        bytes.buffer,
                        { name: "ECDSA", namedCurve: "P-256" },
                        false,
                        ["sign"]
                    );
                    const sigBuf = await window.crypto.subtle.sign(
                        { name: "ECDSA", hash: { name: "SHA-256" } },
                        key,
                        new TextEncoder().encode(sessionId)
                    );
                    const sigBytes = new Uint8Array(sigBuf);
                    let bin = "";
                    for (let i = 0; i < sigBytes.byteLength; i++) bin += String.fromCharCode(sigBytes[i]);
                    signature = btoa(bin);
                } catch (eSig) {
                    console.warn("ECDSA signature generation notice:", eSig);
                }

                // 3. Submit Biometric Authentication Approval to CyberNova Backend
                const res = await fetch("/api/auth/bluetooth/approve-mobile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sessionId,
                        email,
                        signature,
                        biometricVerified: true,
                        biometricType: "FINGERPRINT_BIOMETRIC_PROMPT"
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Authentication rejected by server");

                mobileIcon.innerHTML = '<i class="fa-solid fa-circle-check" style="color: #10B981;"></i>';
                mobileIcon.style.borderColor = "rgba(16, 185, 129, 0.4)";
                mobileIcon.style.background = "rgba(16, 185, 129, 0.15)";
                statusPill.className = "status-pill success";
                statusPill.innerHTML = '<strong>✅ Fingerprint Verified!</strong><br>Your desktop session has been authenticated and unlocked.';
                btnVerify.style.display = "none";

            } catch (err) {
                console.error("Biometric verification failure:", err);
                statusPill.className = "status-pill error";
                statusPill.textContent = "❌ " + (err.message || "Fingerprint verification failed.");
                btnVerify.disabled = false;
                btnVerify.innerHTML = '<i class="fa-solid fa-fingerprint"></i> Retry Fingerprint Scan';
            }
        });
    </script>
</body>
</html>
